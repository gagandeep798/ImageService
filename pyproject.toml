[tool.poetry]
name = "image-service"
version = "0.1.0"
description = "Production-grade image upload service on AWS Lambda + S3 + DynamoDB"
authors = ["gagandeep798"]
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
pydantic = "^2.7"
aws-lambda-powertools = {extras = ["all"], version = "^2.38"}
python-multipart = "^0.0.9"
python-ulid = "^2.2"
Pillow = "^10.3"
argon2-cffi = "^23.1"
aioboto3 = "^13.0"
cryptography = "^42.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"
moto = {extras = ["dynamodb", "s3", "sqs", "kinesis", "secretsmanager", "cognitoidp"], version = "^5.0"}
mypy = "^1.10"
ruff = "^0.4"
boto3-stubs = {extras = ["dynamodb", "s3", "sqs", "kinesis", "secretsmanager", "cognito-idp", "lambda", "cloudwatch"], version = "^1.34"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires LocalStack running",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
