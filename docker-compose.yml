version: "3.8"

# All Docker-specific config (image versions, port mappings, container settings) is
# loaded from docker/.env — the single source of truth for this compose file.
# Application-level config lives in .env (not loaded here).
# Secrets come from docker/.env.secrets (generated by scripts/fetch_secrets.sh, not committed).
# docker/.env.secrets is optional — services start without it; run `make fetch-secrets` to populate it.
#
# Port variables (all in docker/.env):
#   NGINX_PORT                  — host port Nginx binds to (default 8080)
#   LOCALSTACK_PORT             — LocalStack container port (default 4566)
#   OPENSEARCH_PORT             — OpenSearch container port (default 9200)
#   OPENSEARCH_DASHBOARDS_PORT  — Dashboards container port (default 5601)

networks:
  image-service-net:
    name: image-service-net

volumes:
  localstack_data:
  opensearch_data:

# Reusable env_file anchors ─────────────────────────────────────────────────
x-docker-env: &docker-env
  - path: docker/.env
    required: true
  - path: docker/.env.secrets
    required: false   # populated by scripts/fetch_secrets.sh; not required for basic startup

services:

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: image-service-nginx:${NGINX_VERSION:-1.0.0}
    container_name: image-service-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    env_file: *docker-env
    environment:
      # Passed explicitly so the nginx entrypoint envsubst can resolve them
      # in /etc/nginx/templates/default.conf.template at container start.
      LOCALSTACK_PORT: ${LOCALSTACK_PORT:-4566}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      OPENSEARCH_DASHBOARDS_PORT: ${OPENSEARCH_DASHBOARDS_PORT:-5601}
    depends_on:
      localstack:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - image-service-net
    restart: unless-stopped

  localstack:
    build:
      context: .
      dockerfile: docker/localstack/Dockerfile
    image: image-service-localstack:${LOCALSTACK_VERSION:-1.0.0}
    container_name: image-service-localstack
    expose:
      - "${LOCALSTACK_PORT:-4566}"
    env_file: *docker-env
    environment:
      SERVICES: ${LOCALSTACK_SERVICES}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: 1
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_ACCOUNT_ID: ${LOCALSTACK_ACCOUNT_ID:-000000000000}
      GATEWAY_LISTEN: "0.0.0.0:${LOCALSTACK_PORT:-4566}"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LOCALSTACK_PORT:-4566}/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - image-service-net
    restart: unless-stopped

  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
    image: image-service-opensearch:${OPENSEARCH_VERSION:-1.0.0}
    container_name: image-service-opensearch
    expose:
      - "${OPENSEARCH_PORT:-9200}"
    env_file: *docker-env
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      - http.port=${OPENSEARCH_PORT:-9200}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${OPENSEARCH_PORT:-9200}/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - image-service-net
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1

  opensearch-dashboards:
    build:
      context: .
      dockerfile: docker/opensearch-dashboards/Dockerfile
    image: image-service-opensearch-dashboards:${OPENSEARCH_DASHBOARDS_VERSION:-1.0.0}
    container_name: image-service-opensearch-dashboards
    expose:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}"
    env_file: *docker-env
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:${OPENSEARCH_PORT:-9200}
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_PORT=${OPENSEARCH_DASHBOARDS_PORT:-5601}
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - image-service-net
    restart: unless-stopped
