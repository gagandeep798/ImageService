name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run ruff check src tests
      - name: Type check
        run: poetry run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install
      - name: Run unit tests
        run: poetry run pytest -m unit --cov=src --cov-report=xml --cov-fail-under=80

  sam-build:
    name: SAM Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Build SAM
        run: sam build --use-container

  integration-tests:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    needs: sam-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install
      - name: Build custom Docker images
        run: docker compose -f docker/docker-compose.yml build
      - name: Start LocalStack + OpenSearch
        run: docker compose -f docker/docker-compose.yml up -d --wait
        timeout-minutes: 3
      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          DYNAMODB_ENDPOINT_URL: http://localhost:4566
          S3_ENDPOINT_URL: http://localhost:4566
          SECRETSMANAGER_ENDPOINT_URL: http://localhost:4566
          IMAGES_TABLE_NAME: image-service-images
          USERS_TABLE_NAME: image-service-users
          MIGRATIONS_TABLE_NAME: image-service-migrations
          ORIGINALS_BUCKET: image-service-originals-000000000000-us-east-1
          PII_PEPPER: ci-test-pepper-not-for-production
          ENV: local
        run: poetry run pytest -m integration -v
      - name: Collect docker logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
