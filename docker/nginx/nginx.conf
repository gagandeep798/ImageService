worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json_combined;

    # Hide upstream server identity
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Custom error pages (no stack traces)
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/5xx.html;

    # Server block is in /etc/nginx/templates/default.conf.template
    # and injected into /etc/nginx/conf.d/ at container start via envsubst.
    include /etc/nginx/conf.d/*.conf;
}
