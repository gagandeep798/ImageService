version: "3.8"

# Standalone LocalStack-only compose file.
# Use this to run LocalStack in isolation without OpenSearch or Nginx.
#
# Usage:
#   docker compose -f docker/docker-compose-localstack.yml up -d --wait
#   docker compose -f docker/docker-compose-localstack.yml down -v
#
# For the full stack (LocalStack + OpenSearch + Nginx), use docker/docker-compose.yml.

networks:
  image-service-net:
    name: image-service-net

volumes:
  localstack_data:

x-docker-env: &docker-env
  - path: .env
    required: true
  - path: .env.secrets
    required: false   # populated by scripts/fetch_secrets.sh; not required for basic startup

services:

  localstack:
    build:
      context: ..
      dockerfile: docker/localstack/Dockerfile
    image: image-service-localstack:${LOCALSTACK_VERSION:-1.0.0}
    container_name: image-service-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:${LOCALSTACK_PORT:-4566}"
    env_file: *docker-env
    environment:
      SERVICES: ${LOCALSTACK_SERVICES}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: 1
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_ACCOUNT_ID: ${LOCALSTACK_ACCOUNT_ID:-000000000000}
      GATEWAY_LISTEN: "0.0.0.0:${LOCALSTACK_PORT:-4566}"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LOCALSTACK_PORT:-4566}/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - image-service-net
    restart: unless-stopped
