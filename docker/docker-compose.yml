version: "3.8"

# All Docker-specific config (image version, port, runtime settings) is
# loaded from .env (relative to this file in docker/).
# Secrets come from .env.secrets (generated by scripts/fetch_secrets.sh, not committed).
# .env.secrets is optional — LocalStack starts without it.

networks:
  image-service-net:
    name: image-service-net

volumes:
  localstack_data:
  frontend_node_modules:
  cognito_data:

x-docker-env: &docker-env
  - path: .env
    required: true
  - path: .env.secrets
    required: false

services:

  cognito-local:
    image: jagregory/cognito-local:latest
    container_name: image-service-cognito
    ports:
      - "${COGNITO_PORT:-9229}:9229"
    volumes:
      - cognito_data:/app/.cognito
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9229',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - image-service-net

  localstack:
    build:
      context: ..
      dockerfile: docker/localstack/Dockerfile
    image: image-service-localstack:${LOCALSTACK_VERSION:-1.0.0}
    container_name: image-service-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:${LOCALSTACK_PORT:-4566}"
    env_file: *docker-env
    environment:
      SERVICES: ${LOCALSTACK_SERVICES}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: 1
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_ACCOUNT_ID: ${LOCALSTACK_ACCOUNT_ID:-000000000000}
      GATEWAY_LISTEN: "0.0.0.0:${LOCALSTACK_PORT:-4566}"
      AWS_ENDPOINT_URL: "http://localhost:${LOCALSTACK_PORT:-4566}"
      COGNITO_ENDPOINT_URL: http://cognito-local:${COGNITO_PORT:-9229}
      APP_ENV: local
      INIT_DIR: /opt/localstack-init
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ../scripts/init/init.sh:/etc/localstack/init/ready.d/01_init.sh:ro
      - ../scripts/init:/opt/localstack-init:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LOCALSTACK_PORT:-4566}/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      cognito-local:
        condition: service_healthy
    networks:
      - image-service-net
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: image-service-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - path: ../frontend/.env.local
        required: false
    environment:
      # Override proxy target so Vite inside Docker can reach SAM on the host
      VITE_SAM_LOCAL_API_URL: http://host.docker.internal:3000
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - image-service-net
