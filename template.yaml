AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Production-grade image upload service (Lambda + S3 + DynamoDB)

Parameters:
  Env:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  ServiceVersion:
    Type: String
    Default: "0.1.0"
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  CognitoEndpointUrl:
    Type: String
    Default: ""
  PiiPepper:
    Type: String
    NoEcho: true
    Default: ""
  SlackWebhookUrl:
    Type: String
    Default: ""
  CloudFrontKeyPairId:
    Type: String
    Default: ""
  CloudFrontPrivateKeyB64:
    Type: String
    Default: ""
  AwsEndpointUrl:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        ENV: !Ref Env
        LOG_LEVEL: !Ref LogLevel
        SERVICE_VERSION: !Ref ServiceVersion
        AWS_DEFAULT_REGION: !Ref AWS::Region
        POWERTOOLS_SERVICE_NAME: image-service
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        IMAGES_TABLE_NAME: !Ref ImagesTable
        USERS_TABLE_NAME: !Ref UsersTable
        MIGRATIONS_TABLE_NAME: !Ref MigrationsTable
        ORIGINALS_BUCKET: !Ref OriginalsBucket
        THUMBNAILS_BUCKET: !Ref ThumbnailsBucket
        QUARANTINE_BUCKET: !Ref QuarantineBucket
        LOGS_BUCKET: !Ref LogsBucket
        FINALIZE_QUEUE_URL: !Ref FinalizeQueue
        SCAN_QUEUE_URL: !Ref ScanQueue
        THUMBNAIL_QUEUE_URL: !Ref ThumbnailQueue
        DYNAMO_GSI2_SHARD_COUNT: "8"
        MAX_IMAGE_SIZE_BYTES: "20971520"
        CHUNK_SIZE_BYTES: "5242880"
        UPLOAD_URL_TTL_SECONDS: "900"
        DOWNLOAD_URL_TTL_SECONDS: "3600"
        DYNAMO_DELETE_ROLE_ARN: !GetAtt DynamoDBDeleteRole.Arn
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        COGNITO_ENDPOINT_URL: !Ref CognitoEndpointUrl
        PII_PEPPER: !Ref PiiPepper
        SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
        CLOUDFRONT_KEY_PAIR_ID: !Ref CloudFrontKeyPairId
        CLOUDFRONT_PRIVATE_KEY_B64: !Ref CloudFrontPrivateKeyB64
        AWS_ENDPOINT_URL: !Ref AwsEndpointUrl

# ── Conditions ────────────────────────────────────────────────────────────────
Conditions:
  IsProd: !Equals [!Ref Env, prod]
  IsLocal: !Equals [!Ref Env, local]
  IsNotLocal: !Not [!Equals [!Ref Env, local]]

Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────────────────

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-images-${Env}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: UserImagesIndex
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: StatusIndex
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [user_id, title, s3_key, content_type, size_bytes]
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-users-${Env}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  MigrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-migrations-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  # ── S3 Buckets ───────────────────────────────────────────────────────────────

  OriginalsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-originals-${AWS::AccountId}-${AWS::Region}-${Env}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/
            Queue: !GetAtt FinalizeQueue.Arn
      LifecycleConfiguration:
        Rules:
          - Id: transition-to-ia
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  ThumbnailsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-thumbnails-${AWS::AccountId}-${AWS::Region}-${Env}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  QuarantineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-quarantine-${AWS::AccountId}-${AWS::Region}-${Env}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-logs-${AWS::AccountId}-${AWS::Region}-${Env}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: lambda-logs-lifecycle
            Status: Enabled
            Prefix: logs/lambda/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
            ExpirationInDays: 365
          - Id: cloudtrail-lifecycle
            Status: Enabled
            Prefix: logs/cloudtrail/
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER
            ExpirationInDays: 2555

  # ── Frontend Bucket ───────────────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-frontend-${AWS::AccountId}-${AWS::Region}-${Env}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "image-service-frontend-oac-${Env}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "image-service-${Env} frontend + API proxy"
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${ImageApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: "/v1/*"
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Logging:
          Bucket: !Sub "image-service-logs-${AWS::AccountId}-${AWS::Region}-${Env}.s3.amazonaws.com"
          Prefix: logs/cloudfront/
          IncludeCookies: false

  # ── SQS Queues ───────────────────────────────────────────────────────────────

  FinalizeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-finalize-dlq-${Env}"
      MessageRetentionPeriod: 1209600  # 14 days

  FinalizeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-finalize-${Env}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FinalizeDLQ.Arn
        maxReceiveCount: 3

  ScanDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-scan-dlq-${Env}"

  ScanQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-scan-${Env}"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScanDLQ.Arn
        maxReceiveCount: 3

  ThumbnailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-thumbnails-dlq-${Env}"
      MessageRetentionPeriod: 1209600  # 14 days

  ThumbnailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-thumbnails-${Env}"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ThumbnailDLQ.Arn
        maxReceiveCount: 3

  # SQS policy to allow S3 to send messages
  FinalizeQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref FinalizeQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FinalizeQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::image-service-originals-${AWS::AccountId}-${AWS::Region}-${Env}"

  # ── DynamoDB Access-Tier IAM Roles ───────────────────────────────────────────
  # Three separate IAM roles enforce least-privilege at the AWS level.
  # Each Lambda function assumes only the role(s) it needs.
  # Role ARNs are stored in Secrets Manager (image-service/{env}/dynamodb)
  # so dynamo.py can STS-assume them at cold-start.

  DynamoDBReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-read-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !Sub "${ImagesTable.Arn}/index/*"
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/index/*"

  DynamoDBWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-write-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBWriteOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !GetAtt UsersTable.Arn
                # Deny updating the soft-delete fields — those belong to the delete role
                Condition:
                  "ForAllValues:StringNotEquals":
                    "dynamodb:Attributes": ["status", "deleted_at", "gdpr_erased_at", "ttl"]

  DynamoDBDeleteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-delete-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBSoftDeleteOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !GetAtt UsersTable.Arn
                # Restrict UpdateItem to only the soft-delete attribute set
                Condition:
                  "ForAllValues:StringEquals":
                    "dynamodb:Attributes":
                      - PK
                      - SK
                      - status
                      - deleted_at
                      - gdpr_erased_at
                      - ttl
                      - GSI2PK
                      - updated_at

  # ── Lambda Functions ──────────────────────────────────────────────────────────

  UploadInitiateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-upload-initiate-${Env}"
      CodeUri: .
      Handler: src.handlers.upload_initiate.handler
      ReservedConcurrentExecutions: 50
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: POST
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: [s3:CreateMultipartUpload]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  UploadPartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-upload-part-${Env}"
      CodeUri: .
      Handler: src.handlers.upload_part.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}/parts
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:UploadPart]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  UploadCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-upload-complete-${Env}"
      CodeUri: .
      Handler: src.handlers.upload_complete.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}/complete
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:CompleteMultipartUpload]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  UploadAbortFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-upload-abort-${Env}"
      CodeUri: .
      Handler: src.handlers.upload_abort.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}/upload
            Method: DELETE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: [s3:AbortMultipartUpload]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  FinalizeUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-finalize-upload-${Env}"
      CodeUri: .
      Handler: src.handlers.finalize_upload.handler
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: 100
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt FinalizeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt FinalizeQueue.QueueName
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:HeadObject]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  ScanCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-scan-complete-${Env}"
      CodeUri: .
      Handler: src.handlers.scan_complete.handler
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScanQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ScanQueue.QueueName
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:CopyObject, s3:DeleteObject]
              Resource:
                - !Sub "${OriginalsBucket.Arn}/*"
                - !Sub "${QuarantineBucket.Arn}/*"

  GenerateThumbnailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-generate-thumbnails-${Env}"
      CodeUri: .
      Handler: src.handlers.generate_thumbnails.handler
      MemorySize: 1024
      Timeout: 120
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ThumbnailQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ThumbnailQueue.QueueName
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - DynamoDBWritePolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${OriginalsBucket.Arn}/*"
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${ThumbnailsBucket.Arn}/*"

  GetImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-get-image-${Env}"
      CodeUri: .
      Handler: src.handlers.get_image.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
  ListImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-list-images-${Env}"
      CodeUri: .
      Handler: src.handlers.list_images.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
  DeleteImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-delete-image-${Env}"
      CodeUri: .
      Handler: src.handlers.delete_image.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}
            Method: DELETE
      Policies:
        # Read: to fetch the image record and verify ownership
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        # Delete: STS assume-role to get the delete-tier resource
        - Statement:
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: !GetAtt DynamoDBDeleteRole.Arn

  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-download-${Env}"
      CodeUri: .
      Handler: src.handlers.download.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}/download
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${OriginalsBucket.Arn}/*"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-health-${Env}"
      CodeUri: .
      Handler: src.handlers.health.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        - Statement:
            - Effect: Allow
              Action: [s3:HeadBucket]
              Resource: !Sub "${OriginalsBucket.Arn}"

  GdprDeleteUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-gdpr-delete-user-${Env}"
      CodeUri: .
      Handler: src.handlers.gdpr_delete_user.handler
      Timeout: 300
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /users/{user_id}
            Method: DELETE
      Policies:
        # Read: paginate the user's images via UserImagesIndex
        - DynamoDBReadPolicy:
            TableName: !Ref ImagesTable
        # Delete: STS assume-role for both tables (images + users)
        - Statement:
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: !GetAtt DynamoDBDeleteRole.Arn

  SlackNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-slack-notifier-${Env}"
      CodeUri: .
      Handler: src.handlers.slack_notifier.handler
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic

  ScaleLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-scale-lambda-${Env}"
      CodeUri: .
      Handler: src.handlers.scale_lambda.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [lambda:GetFunctionConcurrency, lambda:PutFunctionConcurrency]
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:image-service-*"

  # ── Cognito (staging/prod only — local uses jagregory/cognito-local) ─────────

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: IsNotLocal
    Properties:
      UserPoolName: !Sub "image-service-users-${Env}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: user_id
          AttributeDataType: String
          Mutable: false
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: IsNotLocal
    Properties:
      ClientName: !Sub "image-service-client-${Env}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ── API Gateway ───────────────────────────────────────────────────────────────

  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "image-service-api-${Env}"
      StageName: v1
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !If
              - IsNotLocal
              - !GetAtt CognitoUserPool.Arn
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:000000000000:userpool/${CognitoUserPoolId}"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 1000
          ThrottlingRateLimit: 500
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'

  # ── Auth Lambda Functions ─────────────────────────────────────────────────────

  AuthSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-auth-signup-${Env}"
      CodeUri: .
      Handler: src.handlers.auth_signup.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-auth-login-${Env}"
      CodeUri: .
      Handler: src.handlers.auth_login.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  AuthRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "image-service-auth-refresh-${Env}"
      CodeUri: .
      Handler: src.handlers.auth_refresh.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

  # ── CloudWatch Log Groups ─────────────────────────────────────────────────────

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/image-service-${Env}"
      RetentionInDays: !If [IsProd, 30, 7]

  # ── SNS Topic for Alerts ──────────────────────────────────────────────────────

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "image-service-alerts-${Env}"

  # ── CloudWatch Alarms ─────────────────────────────────────────────────────────

  UploadFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "image-service-upload-failed-${Env}"
      MetricName: upload.failed
      Namespace: ImageService
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  DynamoConnectionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "image-service-dynamodb-connection-errors-${Env}"
      MetricName: dynamodb.connection_errors
      Namespace: ImageService
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  FinalizeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "image-service-FinalizeDLQ-${Env}"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FinalizeDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  ScanThreatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "image-service-scan-threat-detected-${Env}"
      MetricName: scan.threat_detected
      Namespace: ImageService
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "image-service-api-5xx-${Env}"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Sub "image-service-api-${Env}"
      Statistic: Average
      Period: 120
      EvaluationPeriods: 2
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  # ── Athena ────────────────────────────────────────────────────────────────────

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "image-service-analysis-${Env}"
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LogsBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 10737418240  # 10 GB

  SlowUploadsQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      WorkGroup: !Ref AthenaWorkgroup
      Name: slow_uploads
      Database: image_service_logs
      QueryString: |
        SELECT DATE_TRUNC('day', from_iso8601_timestamp(timestamp)) AS day,
               APPROX_PERCENTILE(duration_ms, 0.99) AS p99_latency_ms,
               COUNT(*) AS total
        FROM image_service_lambda_logs
        WHERE function_name LIKE '%upload%'
          AND year = YEAR(CURRENT_DATE)
          AND month = MONTH(CURRENT_DATE)
        GROUP BY 1 ORDER BY 1 DESC;

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ImageApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  ImagesTableName:
    Value: !Ref ImagesTable

  UsersTableName:
    Value: !Ref UsersTable

  MigrationsTableName:
    Value: !Ref MigrationsTable

  OriginalsBucketName:
    Value: !Ref OriginalsBucket

  FrontendBucketName:
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain — use as VITE_CLOUDFRONT_DOMAIN
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID — needed for cache invalidation
    Value: !Ref CloudFrontDistribution
