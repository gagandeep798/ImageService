AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Production-grade image upload service (Lambda + S3 + DynamoDB)

Parameters:
  Env:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  ServiceVersion:
    Type: String
    Default: "0.1.0"

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        ENV: !Ref Env
        LOG_LEVEL: !Ref LogLevel
        SERVICE_VERSION: !Ref ServiceVersion
        AWS_DEFAULT_REGION: !Ref AWS::Region
        POWERTOOLS_SERVICE_NAME: image-service
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        IMAGES_TABLE_NAME: !Ref ImagesTable
        USERS_TABLE_NAME: !Ref UsersTable
        MIGRATIONS_TABLE_NAME: !Ref MigrationsTable
        SECRET_HASHES_TABLE_NAME: !Ref SecretHashesTable
        ORIGINALS_BUCKET: !Ref OriginalsBucket
        THUMBNAILS_BUCKET: !Ref ThumbnailsBucket
        QUARANTINE_BUCKET: !Ref QuarantineBucket
        LOGS_BUCKET: !Ref LogsBucket
        FINALIZE_QUEUE_URL: !Ref FinalizeQueue
        SCAN_QUEUE_URL: !Ref ScanQueue
        THUMBNAIL_QUEUE_URL: !Ref ThumbnailQueue
        OPENSEARCH_INDEX_PREFIX: image-service
        DYNAMO_GSI2_SHARD_COUNT: "8"
        MAX_IMAGE_SIZE_BYTES: "20971520"
        CHUNK_SIZE_BYTES: "5242880"
        UPLOAD_URL_TTL_SECONDS: "900"
        DOWNLOAD_URL_TTL_SECONDS: "3600"

# ── Conditions ────────────────────────────────────────────────────────────────
Conditions:
  IsProd: !Equals [!Ref Env, prod]
  IsNotLocal: !Not [!Equals [!Ref Env, local]]

Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────────────────

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-images-${Env}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: UserImagesIndex
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: StatusIndex
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [user_id, title, s3_key, content_type, size_bytes]
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-users-${Env}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: EmailHashIndex_PK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: EmailHashIndex
          KeySchema:
            - {AttributeName: EmailHashIndex_PK, KeyType: HASH}
          Projection: {ProjectionType: KEYS_ONLY}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  MigrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-migrations-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  SecretHashesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "image-service-secret-hashes-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 Buckets ───────────────────────────────────────────────────────────────

  OriginalsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-originals-${AWS::AccountId}-${AWS::Region}-${Env}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/
            Queue: !GetAtt FinalizeQueue.Arn
      LifecycleConfiguration:
        Rules:
          - Id: transition-to-ia
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  ThumbnailsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-thumbnails-${AWS::AccountId}-${AWS::Region}-${Env}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  QuarantineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-quarantine-${AWS::AccountId}-${AWS::Region}-${Env}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-logs-${AWS::AccountId}-${AWS::Region}-${Env}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: lambda-logs-lifecycle
            Status: Enabled
            Prefix: logs/lambda/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
            ExpirationInDays: 365
          - Id: cloudtrail-lifecycle
            Status: Enabled
            Prefix: logs/cloudtrail/
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER
            ExpirationInDays: 2555

  # ── SQS Queues ───────────────────────────────────────────────────────────────

  FinalizeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-finalize-dlq-${Env}"
      MessageRetentionPeriod: 1209600  # 14 days

  FinalizeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-finalize-${Env}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FinalizeDLQ.Arn
        maxReceiveCount: 3

  ScanDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-scan-dlq-${Env}"

  ScanQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-scan-${Env}"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScanDLQ.Arn
        maxReceiveCount: 3

  ThumbnailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "image-service-thumbnails-${Env}"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400

  # SQS policy to allow S3 to send messages
  FinalizeQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref FinalizeQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FinalizeQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::image-service-originals-${AWS::AccountId}-${AWS::Region}-${Env}"

  # ── DynamoDB Access-Tier IAM Roles ───────────────────────────────────────────
  # Three separate IAM roles enforce least-privilege at the AWS level.
  # Each Lambda function assumes only the role(s) it needs.
  # Role ARNs are stored in Secrets Manager (image-service/{env}/dynamodb)
  # so dynamo.py can STS-assume them at cold-start.

  DynamoDBReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-read-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !Sub "${ImagesTable.Arn}/index/*"
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/index/*"

  DynamoDBWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-write-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBWriteOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !GetAtt UsersTable.Arn
                # Deny updating the soft-delete fields — those belong to the delete role
                Condition:
                  "ForAllValues:StringNotEquals":
                    "dynamodb:Attributes": ["status", "deleted_at", "gdpr_erased_at", "ttl"]

  DynamoDBDeleteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "image-service-dynamo-delete-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBSoftDeleteOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !GetAtt UsersTable.Arn
                # Restrict UpdateItem to only the soft-delete attribute set
                Condition:
                  "ForAllValues:StringEquals":
                    "dynamodb:Attributes":
                      - PK
                      - SK
                      - status
                      - deleted_at
                      - gdpr_erased_at
                      - ttl
                      - GSI2PK
                      - updated_at

