version = 0.1

[default.build.parameters]
use_container = true

[dev.deploy.parameters]
stack_name = "image-service-dev"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
parameter_overrides = "Env=dev LogLevel=DEBUG"

[staging.deploy.parameters]
stack_name = "image-service-staging"
resolve_s3 = true
s3_prefix = "image-service-staging"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Env=staging LogLevel=INFO"

[prod.deploy.parameters]
stack_name = "image-service-prod"
resolve_s3 = true
s3_prefix = "image-service-prod"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "Env=prod LogLevel=WARNING"
